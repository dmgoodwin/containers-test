version: '3.8'

# heavily used https://dev.to/ehtesham_ali_abc367f36a5b/dockerize-your-php-and-mysql-application-a-step-by-step-guide-to-multi-container-apps-4g4g as a reference
services:
  php-app:
    build: ./php-app
    ports:
      - 8080:80
    depends_on:
      - mysql

  mysql:
    build: ./database
    ports:
      - 3306:3306
    volumes:
      - mysql-data:/var/lib/mysql
      
volumes:
  mysql-data:
